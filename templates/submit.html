{% extends "base.html" %}

{% block content %}

<div style = "text-align:center; margin-bottom:-30px;">
<h1 class="loose-letters">
        <span class="line-1">
            <span>s</span><span>u</span><span>b</span><span>m</span><span>i</span><span>t</span>
        </span>
        
        <span class="line-2">
            <span class="small-word">
                <span>a</span>
            </span>

            
            <span class="space">&nbsp;</span>
            <span>w</span><span>o</span><span>r</span><span>d</span> 
        </span>

    </h1>

    <p style="margin-top:-50px;">Fill out the form below to submit a word to our dictionary!</p>
</div>

<div class="form-container">
    
    <form action="/submit" method="POST" class="cute-form">
        
        <div class="input-group horizontal-group">
            <label for="word">Word:</label>
            <input type="text" id="word" name="word" placeholder="e.g., Housewife" maxlength="30">
        </div>

        <div class="input-group horizontal-group">
            <label for="language">Language:</label>
            <input type="text" id="language" name="language" placeholder="e.g., English" maxlength="20">
        </div>

        <div class="input-group">
            <label for="story">Your story:</label>
            <textarea id="story" name="story" placeholder="What's it about this word that made you choose it?" maxlength="1000"></textarea>
        </div>

        <button type="submit" class="submit-btn">
            Submit >
        </button>
        
    </form>
</div>
{% endblock %}
