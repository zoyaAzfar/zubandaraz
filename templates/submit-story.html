{% extends "base.html" %}

{% block title %}Share a Story for {{ entry.word }} — Zuban Daraz{% endblock %}

{% block content %}
<div class="entry-detail-container edit-mode-container">
    
    <div class="entry-detail-header">
        <h1 class="entry-detail-word">Share a Story: "{{ entry.word }}"</h1>
        <p style="font-family: 'Mondwest', serif; font-size: 1.2rem; color: #555; margin-top: 10px;">
            How do you use this word? Do you have a memory attached to it?
        </p>
    </div>

    <form method="POST" action="{{ url_for('submit_story', slug=entry.slug) }}" class="wiki-edit-form">

        <label for="content" class="section-label">Your Story</label>
        <textarea id="content" name="content" rows="8" required placeholder="Write your story or memory here..."></textarea>

        <div class="form-row" style="margin-top: 15px;">
            <div class="form-group">
                <label for="submitted_by">Your name or email (optional)</label>
                <input type="text" id="submitted_by" name="submitted_by" maxlength="150" placeholder="e.g., Anonymous or Ayesha">
            </div>
        </div>

        <div class="edit-form-actions">
            <!-- I made the button pink to match the 'Share your story' button! -->
            <button type="submit" class="save-btn" style="background-color: var(--pink);">Submit for review</button>
            <a href="{{ url_for('entry_detail', slug=entry.slug) }}" class="cancel-link">Cancel</a>
        </div>

    </form>
</div>
{% endblock %}
