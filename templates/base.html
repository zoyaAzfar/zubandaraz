<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Zuban Daraz{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">

</head>

<body>

<header>
    <nav class="tab-container">
        <a href="/" class="tab {% if request.path == '/' %}active{% endif %}">Home</a>
        <a href="/submit" class="tab {% if request.path == '/submit' %}active{% endif %}">Submit</a>
        <a href="/browse" class="tab {% if request.path == '/browse' %}active{% endif %}">Browse</a>
    </nav>
</header>


{% block content %}
{% endblock %}


<footer>
    <h1>You've reached the end.</h1>

    <p>Aurat ki Zuban | 2026</p>



</footer>

</body>

</html>
