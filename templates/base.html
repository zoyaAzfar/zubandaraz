<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Zuban Daraz{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
</head>

<body>

<header>
    <nav class="tab-container">
        <div class="nav-left">
            <a href="/" class="tab {% if request.path == '/' %}active{% endif %}">Home</a>
            <a href="/browse" class="tab {% if request.path == '/browse' %}active{% endif %}">Browse</a>
            <a href="/about" class="tab {% if request.path == '/about' %}active{% endif %}">About</a>
        </div>
        <div class="nav-right">
            <form class="nav-search" action="/browse" method="get">
                <input type="text" name="q" placeholder="Search..." autocomplete="off">
                <button type="submit" aria-label="Search"><span class="material-symbols-outlined">
                    search
                </span></button>
            </form>
            <a href="/submit" class="tab submit-tab {% if request.path == '/submit' %}active{% endif %}">Submit</a>
        </div>
    </nav>
</header>


{% block content %}
{% endblock %}


<footer>
    <h1>You've reached the end.</h1>

    <p>Aurat ki Zuban | 2026</p>



</footer>

    <script> 
    document.addEventListener("DOMContentLoaded", function() {
    var searchBar = document.getElementById('search-bar');
    var rows = document.querySelectorAll('.entry-row');
    var currentCategory = 'all';
    const dropdown = document.getElementById('custom-dropdown');
    const dropdownBtn = document.getElementById('dropdown-btn');
    const selectedOption = document.getElementById('selected-option');
    const menuItems = dropdown.querySelectorAll('.dropdown-menu li');

    // NEW: pick up ?q= from the nav search bar
    var params = new URLSearchParams(window.location.search);
    var initialQuery = params.get('q');
    if (initialQuery) {
        searchBar.value = initialQuery;
    }

    function performSearch() {
        var query = searchBar.value.toLowerCase().trim();
        rows.forEach(function(row) {
            var word = (row.getAttribute('data-word') || '');
            var lang = (row.getAttribute('data-language') || '');
            var origin = (row.getAttribute('data-origin') || '');
            var match;
            if (currentCategory === 'word') {
                match = word.includes(query);
            } else if (currentCategory === 'language') {
                match = lang.includes(query);
            } else if (currentCategory === 'origin') {
                match = origin.includes(query);
            } else {
                match = word.includes(query) || lang.includes(query) || origin.includes(query);
            }
            row.style.display = match ? '' : 'none';
        });
    }

    searchBar.addEventListener('input', performSearch);
    dropdownBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
    });
    menuItems.forEach(item => {
        item.addEventListener('click', () => {
            selectedOption.textContent = item.textContent;
            currentCategory = item.dataset.value;
            dropdown.classList.remove('open');
            performSearch();
        });
    });
    document.addEventListener('click', () => {
        dropdown.classList.remove('open');
    });

    performSearch(); // run once on load so a ?q= from the nav actually filters
});
    
    </script>
</body>

</html>
