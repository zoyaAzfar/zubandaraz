<!-- Add this right below your "Pending Edits" section -->

    <section
        class="admin-section"
        style="margin-top: 50px;"
    >
        <h2>Pending Community Stories</h2>

        {% for story in pending_stories %}
            <div
                class="admin-story-card"
                style="
                    border: 1px solid #ccc;
                    padding: 20px;
                    margin-bottom: 25px;
                    border-radius: 8px;
                    background-color: #fafafa;
                "
            >
                <!-- Assuming your Python backend passes the word string with the story -->
                <h2>
                    Word: {{ story.word }}
                </h2>

                <p>
                    <strong>Story Content:</strong><br>
                    <span style="white-space: pre-wrap;">{{ story.content }}</span>
                </p>

                <p>
                    <strong>Submitted by:</strong>
                    {{ story.submitted_by or "Anonymous" }}
                </p>

                <p style="font-size: 0.9em; color: #777;">
                    <strong>Submitted on:</strong> {{ story.created_at }}
                </p>

                <hr style="margin: 15px 0;">

                <!-- APPROVE STORY -->
                <form
                    action="/approve_story/{{ story.id }}"
                    method="POST"
                    style="display: inline-block;"
                >
                    <button
                        type="submit"
                        class="submit-btn"
                        style="
                            background-color: #4CAF50;
                            color: white;
                            padding: 10px 15px;
                            border: none;
                            cursor: pointer;
                            border-radius: 4px;
                        "
                    >
                        Approve Story
                    </button>
                </form>

                <!-- REJECT STORY -->
                <form
                    action="/reject_story/{{ story.id }}"
                    method="POST"
                    style="
                        display: inline-block;
                        margin-left: 10px;
                    "
                >
                    <button
                        type="submit"
                        class="submit-btn"
                        style="
                            background-color: #f44336;
                            color: white;
                            padding: 10px 15px;
                            border: none;
                            cursor: pointer;
                            border-radius: 4px;
                        "
                    >
                        Reject & Delete
                    </button>
                </form>

            </div>

        {% else %}

            <p>
                No pending stories to review.
            </p>

        {% endfor %}

    </section>
