{% extends "base.html" %}

{% block title %}Editing {{ entry.word }} — Zuban Daraz{% endblock %}

{% block content %}
<div class="entry-detail-container edit-mode-container">
    
    <div class="edit-banner">
        Changes are reviewed before going live. The current entry stays visible in the meantime.
    </div>

    <div class="entry-detail-header">
        <h1 class="entry-detail-word">Editing: "{{ entry.word }}"</h1>
    </div>

    <form method="POST" action="{{ url_for('edit_entry', slug=entry.slug) }}" class="wiki-edit-form">

        <div class="form-row">
            <div class="form-group">
                <label for="word">Word</label>
                <input type="text" id="word" name="word" value="{{ entry.word }}" maxlength="100">
            </div>
            <div class="form-group">
                <label for="language">Language</label>
                <input type="text" id="language" name="language" value="{{ entry.language }}" maxlength="100">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="dialect">Dialect</label>
                <input type="text" id="dialect" name="dialect" value="{{ entry.dialect or '' }}" maxlength="100">
            </div>
            <div class="form-group">
                <label for="origin">Origin</label>
                <input type="text" id="origin" name="origin" value="{{ entry.origin or '' }}" maxlength="150">
            </div>
        </div>

        <label for="literal_definition" class="section-label">Literal definition</label>
        <textarea id="literal_definition" name="literal_definition" rows="3">{{ entry.literal_definition or '' }}</textarea>

        <label for="etymology" class="section-label">Etymology</label>
        <textarea id="etymology" name="etymology" rows="4">{{ entry.etymology or '' }}</textarea>

        <div class="form-row">
            <div class="form-group">
                <label for="source">Source</label>
                <input type="text" id="source" name="source" value="{{ entry.source or '' }}" maxlength="250">
            </div>
            <div class="form-group">
                <label for="submitted_by">Your name or email (optional)</label>
                <input type="text" id="submitted_by" name="submitted_by" maxlength="150">
            </div>
        </div>

        <div class="edit-form-actions">
            <button type="submit" class="save-btn">Submit edit for review</button>
            <a href="{{ url_for('entry_detail', slug=entry.slug) }}" class="cancel-link">Cancel</a>
        </div>

    </form>
</div>
{% endblock %}
